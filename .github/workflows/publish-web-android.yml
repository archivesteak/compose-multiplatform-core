name: Publish web and Android variants

# Why this exists: Kotlin 2.4.0's SourceSetVisibilityProvider requires a commonMain dependency to
# resolve to a real platform variant in *every* platform compilation of the consumer, or the
# dependency contributes zero source sets to the metadata compile classpath (it vanishes silently).
# MaterialKolor declares android, jvm, js, wasmJs, macosArm64, mingwX64, iosArm64 and
# iosSimulatorArm64, so an unmodified MaterialKolor can only build against our Compose fork if the
# fork publishes all of those. This workflow fills js, wasmJs and android, and also fills Skiko's
# declared linuxX64/linuxArm64 variants; publish-apple.yml covers the Apple targets; desktop and
# mingwX64 are published locally on Windows.
#
# js/wasmJs compile anywhere (pure Kotlin/JS, prebuilt Skia downloaded per platform), and android
# builds on the ubuntu runner's preinstalled SDK. Nothing here needs a hand-built Skia: only
# mingwX64 does, and it is disabled below.
#
# Output is a plain Maven repository layout uploaded as a workflow artifact, same contract as
# publish-apple.yml. Its root .module files must be union-merged with the local and Apple metadata;
# blindly overwriting one partial publication with another would hide otherwise valid variants.

on:
  workflow_dispatch:
    inputs:
      compose_ref:
        description: "Full 40-character commit SHA of archivesteak/compose-multiplatform-core to build"
        required: true
      skiko_ref:
        description: "Full 40-character commit SHA of archivesteak/skiko to build"
        required: true

# Checkout is the only operation that needs the workflow token. It is read-only and is not kept in
# either checkout, so these artifact-only jobs have no credential capable of pushing a repository.
permissions:
  contents: read

jobs:
  web-android:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      MAVEN_REPOSITORY: ${{ github.workspace }}/producer-maven/repository

    steps:
      - name: Validate requested source revisions
        env:
          COMPOSE_REF: ${{ inputs.compose_ref }}
          SKIKO_REF: ${{ inputs.skiko_ref }}
        run: |
          for declaration in "compose_ref=$COMPOSE_REF" "skiko_ref=$SKIKO_REF"; do
            name=${declaration%%=*}
            value=${declaration#*=}
            if [[ ! "$value" =~ ^[0-9a-f]{40}$ ]]; then
              echo "$name must be a full lowercase 40-character commit SHA"
              exit 1
            fi
          done

      - name: Check out the Compose fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.compose_ref }}
          path: compose-multiplatform-core
          persist-credentials: false

      - name: Verify the checked-out Compose revision
        env:
          COMPOSE_REF: ${{ inputs.compose_ref }}
        run: |
          resolved=$(git -C compose-multiplatform-core rev-parse HEAD)
          if [ "$resolved" != "$COMPOSE_REF" ]; then
            echo "Compose checkout resolved to $resolved, expected $COMPOSE_REF"
            exit 1
          fi

      - name: Check out the skiko fork
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: archivesteak/skiko
          ref: ${{ inputs.skiko_ref }}
          path: skiko
          persist-credentials: false

      - name: Verify the checked-out skiko revision
        env:
          SKIKO_REF: ${{ inputs.skiko_ref }}
        run: |
          resolved=$(git -C skiko rev-parse HEAD)
          if [ "$resolved" != "$SKIKO_REF" ]; then
            echo "skiko checkout resolved to $resolved, expected $SKIKO_REF"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The Android SDK is preinstalled on the runner; point the androidx build at it explicitly.
      - name: Point the build at the Android SDK
        run: echo "sdk.dir=$ANDROID_HOME" > compose-multiplatform-core/local.properties

      # skiko's web targets link a wasm side module with emcc. Upstream pins Emscripten 4.0.7
      # (skiko/.github/workflows/tests.yml); only its bin directory goes on PATH.
      - name: Install Emscripten
        working-directory: skiko
        run: |
          git clone --depth 1 --branch 4.0.7 https://github.com/emscripten-core/emsdk.git
          test "$(git -C emsdk rev-parse HEAD)" = c69d433d8509c5c64564c2f0d054bf102a5cf67e
          ./emsdk/emsdk install 4.0.7
          ./emsdk/emsdk activate 4.0.7
          echo "$PWD/emsdk/upstream/emscripten" >> "$GITHUB_PATH"

      # skiko must land in mavenLocal first: the Compose fork's js/wasmJs sources resolve it from
      # there by coordinate. skiko.wasm.enabled gates both web targets. This shard owns only web
      # and Android, so disable AWT explicitly; the Windows shard owns the JVM/AWT variants and the
      # strict final union combines the disjoint root metadata. deploy.release=true withholds the
      # -SNAPSHOT suffix, matching the version the Windows publish and the Compose fork both use.
      - name: Build and publish skiko (js + wasmJs + Android)
        working-directory: skiko/skiko
        run: |
          ./gradlew --no-daemon :publishToMavenLocal \
            -Dmaven.repo.local="$MAVEN_REPOSITORY" \
            -Pdeploy.release=true \
            -Pskiko.wasm.enabled=true \
            -Pskiko.android.enabled=true \
            -Pskiko.awt.enabled=false \
            -Pskiko.native.mingw.enabled=false

      - name: Verify skiko web and Android publications
        run: |
          python3 compose-multiplatform-core/.github/scripts/verify-maven-kmp-publications.py \
            "$MAVEN_REPOSITORY" \
            --coordinate io.github.archivesteak.skiko:skiko:0.151.0-alpha04-mingw \
            --target android=.aar \
            --target js=.klib \
            --target wasmJs=.klib \
            --forbid-root-variant-prefix mingwX64

          python3 - "$MAVEN_REPOSITORY" <<'PY'
          import hashlib
          import json
          import sys
          import zipfile
          from pathlib import Path

          repository = Path(sys.argv[1])
          group = repository / "io/github/archivesteak/skiko"
          version = "0.151.0-alpha04-mingw"
          root_module = group / "skiko" / version / f"skiko-{version}.module"
          root = json.loads(root_module.read_text(encoding="utf-8"))
          root_variants = {variant["name"]: variant for variant in root["variants"]}
          forbidden = sorted(name for name in root_variants if name.startswith("mingwX64"))
          if forbidden:
              raise SystemExit("web Skiko root leaks mingw variants: " + ", ".join(forbidden))

          for artifact in ("skiko-android-runtime-x64", "skiko-android-runtime-arm64"):
              artifact_dir = group / artifact / version
              runtime = artifact_dir / f"{artifact}-{version}.jar"
              if not runtime.is_file() or runtime.stat().st_size == 0:
                  raise SystemExit(f"missing Android native runtime: {runtime}")
              with zipfile.ZipFile(runtime) as archive:
                  names = archive.namelist()
              if not any(name.endswith(".so") for name in names):
                  raise SystemExit(f"{runtime} contains no Android shared library")
              if not any(name.endswith(".sha256") for name in names):
                  raise SystemExit(f"{runtime} contains no native-library checksum")
              print(f"verified Android native runtime: {runtime} ({runtime.stat().st_size} bytes)")

          expected = {
              "skikoWasmRuntimeElementsForJs": "skiko-js",
              "skikoWasmRuntimeElementsForWasmJs": "skiko-wasm-js",
          }
          required_entries = {
              "skiko.mjs",
              "skiko.wasm",
              "js-skiko-reexport-symbols.mjs",
          }
          for root_variant_name, artifact in expected.items():
              root_variant = root_variants.get(root_variant_name)
              if root_variant is None or root_variant.get("available-at", {}).get("module") != artifact:
                  raise SystemExit(f"{root_module} has no valid {root_variant_name} redirect")
              target_module = group / artifact / version / f"{artifact}-{version}.module"
              target = json.loads(target_module.read_text(encoding="utf-8"))
              candidates = [
                  variant for variant in target["variants"]
                  if variant.get("attributes", {}).get("org.gradle.usage") == "skiko-runtime"
              ]
              if len(candidates) != 1 or len(candidates[0].get("files", [])) != 1:
                  raise SystemExit(f"{target_module} has no unique skiko-runtime file")
              declared = candidates[0]["files"][0]
              runtime = target_module.parent / declared["url"]
              payload = runtime.read_bytes()
              if len(payload) != declared["size"]:
                  raise SystemExit(f"size mismatch for {runtime}")
              if hashlib.sha256(payload).hexdigest() != declared["sha256"]:
                  raise SystemExit(f"SHA-256 mismatch for {runtime}")
              with zipfile.ZipFile(runtime) as archive:
                  missing = sorted(required_entries - set(archive.namelist()))
              if missing:
                  raise SystemExit(f"{runtime} lacks runtime entries: {', '.join(missing)}")
              print(f"verified {root_variant_name}: {runtime} ({len(payload)} bytes)")
          PY

      # Skiko declares both Linux/Native targets in its root metadata. Build them with the exact
      # cross-toolchain image checked into the pinned Skiko revision. Keep JVM/AWT configured so
      # commonMain remains genuinely common metadata: with only Native targets KGP compiles it as
      # native-shared metadata and rejects @OptionalExpectation. Only the two Linux publications
      # execute, and the following step allowlists their four root variants before union.
      - name: Build and publish skiko (linuxX64 + linuxArm64)
        run: |
          docker build \
            --tag skiko-linux-native:ci \
            skiko/skiko/docker/linux-amd64
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -v "$GITHUB_WORKSPACE":/workspace \
            -v "$HOME/.gradle":/gradle-cache \
            -v "$MAVEN_REPOSITORY":/maven-repository \
            -e GRADLE_USER_HOME=/gradle-cache \
            -e HOME=/tmp \
            -w /workspace/skiko \
            skiko-linux-native:ci \
            bash -euo pipefail -c '
              ./gradlew -p skiko --no-daemon --stacktrace --rerun-tasks \
                -Duser.home=/tmp \
                -Dmaven.repo.local=/maven-repository \
                -Pdeploy.release=true \
                -Pskiko.native.enabled=true \
                -Pskiko.awt.enabled=true \
                publishLinuxArm64PublicationToMavenLocal \
                publishLinuxX64PublicationToMavenLocal \
                generateMetadataFileForKotlinMultiplatformPublication \
                buildKotlinToolingMetadata
            '

      # A target-only Gradle publication intentionally does not rewrite the root KMP descriptor.
      # Union the Linux variants generated under the native configuration into the already-published
      # JS/Wasm/AWT root descriptor, keeping the latter's overlapping metadata variants intact.
      - name: Merge and verify skiko Linux module metadata
        run: |
          python3 compose-multiplatform-core/.github/scripts/merge-gradle-module-metadata.py \
            skiko/skiko/build/publications/kotlinMultiplatform/module.json \
            "$MAVEN_REPOSITORY" \
            --source-tooling-metadata skiko/skiko/build/kotlinToolingMetadata/kotlin-tooling-metadata.json \
            --include-variant linuxX64ApiElements-published \
            --include-variant linuxX64SourcesElements-published \
            --include-variant linuxArm64ApiElements-published \
            --include-variant linuxArm64SourcesElements-published \
            --require-variant linuxX64ApiElements-published \
            --require-variant linuxArm64ApiElements-published \
            --include-konan-target linux_x64 \
            --include-konan-target linux_arm64

          python3 - "$MAVEN_REPOSITORY" \
            skiko/skiko/build/publications/kotlinMultiplatform/module.json <<'PY'
          import json
          import sys
          import zipfile
          from pathlib import Path

          repository = Path(sys.argv[1])
          generated = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          component = generated["component"]
          group = component["group"]
          artifact = component["module"]
          version = component["version"]
          group_path = repository.joinpath(*group.split("."))
          root_module = group_path / artifact / version / f"{artifact}-{version}.module"
          root = json.loads(root_module.read_text(encoding="utf-8"))
          root_variants = {variant["name"]: variant for variant in root["variants"]}
          tooling_path = root_module.with_name(
              f"{artifact}-{version}-kotlin-tooling-metadata.json"
          )
          tooling = json.loads(tooling_path.read_text(encoding="utf-8"))
          tooling_konan_targets = {
              target.get("extras", {}).get("native", {}).get("konanTarget")
              for target in tooling["projectTargets"]
          }
          missing_tooling_targets = {"linux_x64", "linux_arm64"} - tooling_konan_targets
          if missing_tooling_targets:
              raise SystemExit(
                  f"{tooling_path} lacks tooling targets: "
                  + ", ".join(sorted(missing_tooling_targets))
              )
          if "mingw_x64" in tooling_konan_targets:
              raise SystemExit(f"{tooling_path} leaks the local-only mingw_x64 target")
          forbidden_variants = sorted(
              name for name in root_variants if name.startswith("mingwX64")
          )
          if forbidden_variants:
              raise SystemExit(
                  "Linux CI metadata must not claim the locally built GNU target: "
                  + ", ".join(forbidden_variants)
              )
          stale_sidecars = [
              *root_module.parent.glob(root_module.name + ".*"),
              *tooling_path.parent.glob(tooling_path.name + ".*"),
          ]
          if stale_sidecars:
              raise SystemExit(
                  "mutated root metadata retains invalid signature/checksum sidecars: "
                  + ", ".join(path.name for path in stale_sidecars)
              )

          expected = {
              "linuxX64ApiElements-published": "skiko-linuxx64",
              "linuxArm64ApiElements-published": "skiko-linuxarm64",
          }
          for variant_name, target_artifact in expected.items():
              variant = root_variants.get(variant_name)
              if variant is None:
                  raise SystemExit(f"{root_module} lacks {variant_name}")
              available_at = variant.get("available-at", {})
              if available_at.get("module") != target_artifact:
                  raise SystemExit(
                      f"{variant_name} points to {available_at.get('module')}, "
                      f"not {target_artifact}"
                  )
              target_dir = group_path / target_artifact / version
              target_module = target_dir / f"{target_artifact}-{version}.module"
              klibs = list(target_dir.glob("*.klib"))
              if not target_module.is_file() or not klibs or not all(p.stat().st_size for p in klibs):
                  raise SystemExit(f"incomplete {target_artifact} publication in {target_dir}")
              with zipfile.ZipFile(klibs[0]) as archive:
                  names = set(archive.namelist())
              if "default/manifest" not in names or not any(
                  name.startswith(("default/ir/", "default/linkdata/")) for name in names
              ):
                  raise SystemExit(f"{klibs[0]} is not a populated Kotlin/Native KLIB")
              print(f"verified {variant_name}: {klibs[0]} ({klibs[0].stat().st_size} bytes)")
          PY

      # -mac,-windows keep Apple and mingwX64 targets out: Apple belongs to publish-apple.yml, and
      # mingwX64 would demand the hand-built GNU-ABI Skia that only exists on the Windows machine.
      - name: Build and publish the Compose fork (js, wasmJs, android)
        working-directory: compose-multiplatform-core
        run: |
          ./gradlew --no-daemon :mpp:publishWebAndroidConsumerClosureToMavenLocal \
            -Dmaven.repo.local="$MAVEN_REPOSITORY" \
            -Pcompose.platforms=js,wasmJs,android \
            -Pandroidx.enabled.kmp.target.platforms=-mac,-windows

      # Exercise the runtime variant reselection and the alpha04 JS module filename, neither of
      # which is covered by compiling/publishing KLIBs alone.
      - name: Verify Compose web runtime integration
        working-directory: compose-multiplatform-core
        run: |
          ./gradlew --no-daemon \
            -Dmaven.repo.local="$MAVEN_REPOSITORY" \
            -Pcompose.platforms=js,wasmJs,android \
            -Pandroidx.enabled.kmp.target.platforms=-mac,-windows \
            :compose:ui:ui:fetchSkikoJsWasmRuntime \
            :compose:ui:ui:fetchSkikoWasmRuntime \
            :compose:mpp:demo:compileKotlinJs \
            :compose:mpp:demo:compileKotlinWasmJs
          test -s compose/ui/ui/build/resources/skiko-js/skiko.mjs
          test -s compose/ui/ui/build/resources/skiko-js/skiko.wasm
          test -s compose/ui/ui/build/resources/skiko-js/js-skiko-reexport-symbols.mjs
          test -s compose/ui/ui/build/resources/skiko-wasm/skiko.mjs
          test -s compose/ui/ui/build/resources/skiko-wasm/skiko.wasm

      # Ship only this fork's own coordinates, same reasoning as publish-apple.yml.
      - name: Collect the published artifacts
        run: |
          mkdir -p staging/repository/io/github/archivesteak
          python3 compose-multiplatform-core/.github/scripts/write-provenance.py \
            --owner web \
            --output staging/repository/provenance/web.json \
            --source "compose=$(git -C compose-multiplatform-core rev-parse HEAD)" \
            --source "skiko=$(git -C skiko rev-parse HEAD)"
          # Skiko's *-runtime-all jars contain only the current host's native library in a local
          # build. Two jobs would therefore produce different bytes at one coordinate, which cannot
          # be union-merged. Consumers use the per-OS artifacts; omit the misleading fat jars.
          rsync -a \
            --exclude='skiko/skiko-awt-runtime-all/' \
            "$MAVEN_REPOSITORY/io/github/archivesteak/" \
            staging/repository/io/github/archivesteak/
          # Normalize the configured-all/published-subset Gradle descriptors before verification;
          # every redirect and direct fork dependency left must exist in this producer shard.
          python3 compose-multiplatform-core/.github/scripts/prune-missing-kmp-redirects.py \
            staging/repository \
            --close-group-prefix io.github.archivesteak
          unexpected=$(
            find staging/repository/io/github/archivesteak -mindepth 1 -maxdepth 1 -type d \
              ! -name compose ! -name skiko ! -name androidx -print
            find staging/repository/io/github/archivesteak/androidx -mindepth 1 -maxdepth 1 \
              -type d ! -name navigationevent -print
            find staging/repository/io/github/archivesteak/androidx/navigationevent \
              -mindepth 1 -maxdepth 1 -type d ! -name navigationevent-compose -print
          )
          if [ -n "$unexpected" ]; then
            echo "Unexpected library families in scoped artifact:"
            echo "$unexpected"
            exit 1
          fi
          if find staging -type d -name skiko-mingwx64 -print -quit | grep -q .; then
            echo "Linux CI must not upload a skiko-mingwx64 publication."
            exit 1
          fi
          test ! -e staging/repository/io/github/archivesteak/skiko/skiko-awt-runtime-all
          test -n "$(find staging/repository/io/github/archivesteak/skiko/skiko-awt-runtime-linux-x64 -name '*.jar' -size +0c -print -quit)"
          test -f staging/repository/io/github/archivesteak/compose/runtime/runtime/1.12.0-beta02-mingw/runtime-1.12.0-beta02-mingw.module
          test -f staging/repository/io/github/archivesteak/compose/ui/ui-test/1.12.0-beta02-mingw/ui-test-1.12.0-beta02-mingw.module
          test -f staging/repository/io/github/archivesteak/compose/material3/material3/1.12.0-alpha03-mingw/material3-1.12.0-alpha03-mingw.module
          test -f staging/repository/io/github/archivesteak/androidx/navigationevent/navigationevent-compose/1.1.1-beta01-mingw/navigationevent-compose-1.1.1-beta01-mingw.module
          test -f staging/repository/provenance/web.json
          # sed consumes the complete stream, avoiding find's SIGPIPE under bash -o pipefail.
          find staging -name "*.klib" | sed -n '1,40p'
          echo "klibs: $(find staging -name '*.klib' | wc -l)"

      - name: Verify collected Compose web and Android publications
        run: |
          python3 compose-multiplatform-core/.github/scripts/verify-maven-kmp-publications.py \
            staging/repository \
            --coordinate io.github.archivesteak.compose.material3:material3:1.12.0-alpha03-mingw \
            --coordinate io.github.archivesteak.compose.foundation:foundation:1.12.0-beta02-mingw \
            --coordinate io.github.archivesteak.compose.runtime:runtime:1.12.0-beta02-mingw \
            --coordinate io.github.archivesteak.compose.ui:ui:1.12.0-beta02-mingw \
            --coordinate io.github.archivesteak.compose.ui:ui-test:1.12.0-beta02-mingw \
            --coordinate io.github.archivesteak.androidx.navigationevent:navigationevent-compose:1.1.1-beta01-mingw \
            --target android=.aar \
            --target js=.klib \
            --target wasmJs=.klib \
            --forbid-root-variant-prefix mingwX64

          python3 compose-multiplatform-core/.github/scripts/verify-maven-dependency-closure.py \
            staging/repository \
            --coordinate io.github.archivesteak.androidx.navigationevent:navigationevent-compose:1.1.1-beta01-mingw \
            --require-dependency io.github.archivesteak.compose.runtime:runtime:1.12.0-beta02-mingw \
            --require-dependency androidx.navigationevent:navigationevent:1.1.1 \
            --forbid-dependency-group-prefix org.jetbrains.compose

          python3 compose-multiplatform-core/.github/scripts/verify-upstream-navigationevent.py

      - name: Fail if nothing was produced
        run: |
          count=$(find staging -name "*.klib" -o -name "*.aar" | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "No klibs or aars were produced - the publish silently did nothing."
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: maven-web-android
          path: staging/repository
          if-no-files-found: error
          retention-days: 7
